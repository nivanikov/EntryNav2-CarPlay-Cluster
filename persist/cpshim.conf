# cpshim persistent config -> installed to /var/local/cpshim.conf (persistent p2, hot-reloaded ~1x/s by the shim).
# The wrapper points CP_CONF here. No CP_SUB_GEN: the v24 anti-boot-loop crash-counter (/var/local/cpshim.boot)
# gates the subscribe now -- it bumps before the first subscribe each boot and resets after CP_STABLE_S of stable
# running; at CP_MAX_CRASHES consecutive boot-crashes it stops subscribing (CarPlay keeps working, no arrows).
CP_RGD_PATCH=1
CP_RGD_SUBSCRIBE=1
CP_FORWARD=1
CP_FWD_LOG=0
CP_RGD_DUMP=0
CP_MAX_CRASHES=3
CP_STABLE_S=45
